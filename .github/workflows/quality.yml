name: Portfolio quality

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-portfolio.txt
      - name: Install chart dependencies
        run: python -m pip install -r requirements-portfolio.txt
      - name: Validate snapshots and rebuild outputs
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp/ecommerce-customer-segmentation-mpl
          XDG_CACHE_HOME: /tmp/ecommerce-customer-segmentation-mpl
        run: make check
      - name: Confirm generated files exist
        run: |
          test -s visualizations/segment_revenue_concentration.png
          test -s visualizations/cohort_retention_heatmap.png
          test -s visualizations/purchase_activity_ladder.png
          test -s visualizations/matched_outcome_differences.png
          test -s visualizations/psm_love_plot.png
          test -s tableau/data/cohort_retention_long.csv
          test -s notebooks/analysis_workbook.ipynb
